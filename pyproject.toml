[project]
name = "hi2"
version = "0.1.0"
description = "Quantizer for the rdna_hint_flex weight format: variable INT2/INT4 (opt-in INT8) rows, Hadamard + hierarchical block params, GPTQ rounding and layer-wise QAD"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["torch", "safetensors", "regex", "transformers"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
hi2 = "hi2.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hi2*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RET"]
# E501: the formatter wraps code; long strings and comments stay readable.
# B905, C408: style only, no behaviour change worth the churn.
ignore = ["E501", "B905", "C408"]

[tool.pytest.ini_options]
pythonpath = ["."]
